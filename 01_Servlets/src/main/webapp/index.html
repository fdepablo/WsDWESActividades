<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora con un servlet</title>
</head>
<body>
    <h1>Calculadora</h1>
    <p>Introduce dos números para sumar, restar, multiplicar y dividir.</p>
    <!-- Formulario que
    <form action="calcular" method="get">
        <p>
            <label for="numero1">Primer número:</label>
            <input type="number" id="numero1" name="numero1" step="any" required>
        </p>
        <p>
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" name="numero2" step="any" required>
        </p>
        <button type="submit">Calcular</button>
    </form>
</body>
</html>
